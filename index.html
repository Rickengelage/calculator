<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-content-container">
        <div class="calc-container">
            <h1>Calculator</h1>
            <div class="output">
            <output class="result">0</output>

             </div>
         <div class="buttons">
            <button ><img src="./images/clear.png" alt=""></button>
            <button ><h1>AC</h1></button>
            <button id="divide"><h1>/</h1></button>
            <button id="multiply"><h1>x</h1></button>
            <button id="seven" ><h1>7</h1></button>
            <button id="eight" ><h1>8</h1></button>
            <button id="nine"><h1>9</h1></button>
            <button id="substract"><h1>-</h1></button>
            <button id="four"><h1>4</h1></button>
            <button id="five"><h1>5</h1></button>
            <button id="six"><h1>6</h1></button>
            <button id="add"><h1>+</h1></button>
            <button id="one"><h1>1</h1></button>
            <button id="two"><h1>2</h1></button>
            <button id="three"><h1>3</h1></button>
            <button id="resultIs"><h1>=</h1></button>
            <button id="zero"><h1>0</h1></button>
            <button id="comma"><h1>,</h1></button>
         </div>


        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
