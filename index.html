<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-content-container">
        <div class="calc-container">
            <h1>Calculator</h1>
            <div class="output">
            <output class="result">0</output>

             </div>
         <div class="buttons">
            <button id="backspace"><img src="./images/clear.png" alt=""></button>
            <button id="clear"><h1 class="clearall">AC</h1></button>
            <button id="divide"><h1 class="split">/</h1></button>
            <button id="multiply"><h1 class="multi">x</h1></button>
            <button id="seven"><h1 class="numberseven">7</h1></button>
            <button id="eight"><h1 class="numbereight">8</h1></button>
            <button id="nine"><h1 class="numbernine">9</h1></button>
            <button id="substract"><h1 class="minus">-</h1></button>
            <button id="four"><h1 class="numberfour">4</h1></button>
            <button id="five"><h1 class="numberfive">5</h1></button>
            <button id="six"><h1 class="numbersix">6</h1></button>
            <button id="add"><h1 class="sum">+</h1></button>
            <button id="one"><h1 class="numberone">1</h1></button>
            <button id="two"><h1 class="numbertwo">2</h1></button>
            <button id="three"><h1 class="numberthree">3</h1></button>
            <button id="resultIs"><h1>=</h1></button>
            <button id="zero"><h1 class="numberzero">0</h1></button>
            <button id="comma"><h1>,</h1></button>
         </div>


        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
